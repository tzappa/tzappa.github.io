<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Pixel Racer</title>
<style>
    html, body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
    }
    canvas {
        display: block;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
    }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function () {
    'use strict';

    // ---- Low-res screen -------------------------------------------------
    var W = 96;              // logical width in pixels (fixed)
    var H = 160;             // logical height, adapted to the screen shape
    var canvas = document.getElementById('game');
    var ctx = canvas.getContext('2d');

    function resize() {
        var vw = window.innerWidth, vh = window.innerHeight;
        H = Math.max(128, Math.min(220, Math.round(W * vh / vw)));
        canvas.width = W;
        canvas.height = H;
        var scale = Math.min(vw / W, vh / H);
        canvas.style.width = Math.floor(W * scale) + 'px';
        canvas.style.height = Math.floor(H * scale) + 'px';
        ctx.imageSmoothingEnabled = false;
    }
    window.addEventListener('resize', resize);
    resize();

    // ---- Road geometry ---------------------------------------------------
    var ROAD_L = 16, ROAD_R = 80, LANES = 4, LANE_W = 16;
    var CAR_W = 10, CAR_H = 16;
    function laneX(i) { return ROAD_L + i * LANE_W + (LANE_W - CAR_W) / 2; }

    // ---- 3x5 pixel font --------------------------------------------------
    var FONT = {
        A: '010101111101101', B: '110101110101110', C: '011100100100011',
        D: '110101101101110', E: '111100110100111', F: '111100110100100',
        G: '011100101101011', H: '101101111101101', I: '111010010010111',
        J: '001001001101010', K: '101101110101101', L: '100100100100111',
        M: '101111111101101', N: '110101101101101', O: '010101101101010',
        P: '110101110100100', Q: '010101101110011', R: '110101110101101',
        S: '011100010001110', T: '111010010010010', U: '101101101101111',
        V: '101101101101010', W: '101101111111101', X: '101101010101101',
        Y: '101101010010010', Z: '111001010100111',
        0: '111101101101111', 1: '010110010010111', 2: '110001010100111',
        3: '110001010001110', 4: '101101111001001', 5: '111100110001110',
        6: '011100111101111', 7: '111001010010010', 8: '111101111101111',
        9: '111101111001110',
        ':': '000010000010000', '-': '000000111000000', '!': '010010010000010',
        '+': '000010111010000', '.': '000000000000010'
    };

    function textWidth(s, size) { return (s.length * 4 - 1) * size; }

    function drawText(s, x, y, color, size) {
        size = size || 1;
        s = String(s);
        ctx.fillStyle = color;
        for (var i = 0; i < s.length; i++) {
            var g = FONT[s[i]];
            if (g) {
                for (var p = 0; p < 15; p++) {
                    if (g[p] === '1') {
                        ctx.fillRect(x + (p % 3) * size, y + ((p / 3) | 0) * size, size, size);
                    }
                }
            }
            x += 4 * size;
        }
    }

    function drawTextC(s, y, color, size) {
        size = size || 1;
        var x = Math.round((W - textWidth(String(s), size)) / 2);
        drawText(s, x + 1, y + 1, '#000', size);   // drop shadow
        drawText(s, x, y, color, size);
    }

    // ---- Sound (tiny square-wave beeps) ---------------------------------
    var audio = null;
    function initAudio() {
        if (audio) { if (audio.state === 'suspended') audio.resume(); return; }
        try {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (AC) audio = new AC();
        } catch (e) { audio = null; }
    }
    function beep(freq, dur, type, vol, slideTo) {
        if (!audio) return;
        try {
            var o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
            o.type = type || 'square';
            o.frequency.setValueAtTime(freq, t);
            if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
            g.gain.setValueAtTime(vol || 0.05, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(g); g.connect(audio.destination);
            o.start(t); o.stop(t + dur);
        } catch (e) { /* ignore */ }
    }

    // ---- Game state ------------------------------------------------------
    var TRAFFIC_COLORS = ['#e8e8e8', '#f2c230', '#3b7dd8', '#3fae4a', '#a05ad0', '#e87a2a'];
    var state = 'title';     // 'title' | 'play' | 'over'
    var best = 0;
    try { best = parseInt(localStorage.getItem('pixelRacerBest'), 10) || 0; } catch (e) {}

    var player, traffic, coins, particles, popups;
    var speed, dist, bonus, spawnDist, lastLane, overTime, shake, time = 0;

    function reset() {
        player = { x: laneX(1) + LANE_W / 2, vx: 0 };
        traffic = []; coins = []; particles = []; popups = [];
        speed = 70; dist = 0; bonus = 0; spawnDist = 60; lastLane = -1;
        overTime = 0; shake = 0;
    }
    reset();

    function playerY() { return H - 30; }
    function score() { return Math.floor(dist / 10) + bonus; }

    // ---- Input -----------------------------------------------------------
    var pointers = {};       // pointerId -> -1 (left) | 1 (right)
    var keys = { left: false, right: false };

    function sideOf(e) { return e.clientX < window.innerWidth / 2 ? -1 : 1; }

    function action() {
        initAudio();
        if (state === 'title' || (state === 'over' && overTime > 0.7)) {
            reset();
            state = 'play';
            beep(440, 0.08); setTimeout(function () { beep(660, 0.12); }, 80);
            return true;
        }
        return false;
    }

    window.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        action();
        pointers[e.pointerId] = sideOf(e);
    }, { passive: false });
    window.addEventListener('pointermove', function (e) {
        if (e.pointerId in pointers) pointers[e.pointerId] = sideOf(e);
    });
    function release(e) { delete pointers[e.pointerId]; }
    window.addEventListener('pointerup', release);
    window.addEventListener('pointercancel', release);
    window.addEventListener('blur', function () { pointers = {}; keys.left = keys.right = false; });
    window.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

    window.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
        else if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
        else if (e.key === ' ' || e.key === 'Enter') action();
    });
    window.addEventListener('keyup', function (e) {
        if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
        else if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    });

    function steer() {
        var d = 0, id;
        for (id in pointers) d += pointers[id];
        if (keys.left) d -= 1;
        if (keys.right) d += 1;
        return Math.max(-1, Math.min(1, d));
    }

    // ---- Update ----------------------------------------------------------
    function spawnRow() {
        var lane;
        do { lane = (Math.random() * LANES) | 0; } while (lane === lastLane);
        lastLane = lane;
        traffic.push({
            x: laneX(lane), y: -CAR_H - 2,
            color: TRAFFIC_COLORS[(Math.random() * TRAFFIC_COLORS.length) | 0],
            passed: false
        });
        var used = [lane];
        // Later on, sometimes a second car in the same row.
        if (speed > 120 && Math.random() < 0.3) {
            var l2;
            do { l2 = (Math.random() * LANES) | 0; } while (l2 === lane);
            used.push(l2);
            traffic.push({
                x: laneX(l2), y: -CAR_H - 2,
                color: TRAFFIC_COLORS[(Math.random() * TRAFFIC_COLORS.length) | 0],
                passed: false
            });
        }
        if (Math.random() < 0.3) {
            var l3;
            do { l3 = (Math.random() * LANES) | 0; } while (used.indexOf(l3) !== -1);
            coins.push({ x: ROAD_L + l3 * LANE_W + LANE_W / 2, y: -30 });
        }
        spawnDist = Math.max(40, 74 - speed * 0.14) + Math.random() * 30 + (used.length > 1 ? 14 : 0);
    }

    function crash() {
        state = 'over';
        overTime = 0;
        shake = 0.4;
        var s = score();
        if (s > best) {
            best = s;
            try { localStorage.setItem('pixelRacerBest', String(best)); } catch (e) {}
        }
        var cols = ['#ffffff', '#ffd23f', '#ff7a1a', '#e03131', '#555555'];
        for (var i = 0; i < 40; i++) {
            var a = Math.random() * Math.PI * 2, v = 20 + Math.random() * 70;
            particles.push({
                x: player.x, y: playerY() + CAR_H / 2,
                vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                life: 0.4 + Math.random() * 0.6,
                color: cols[(Math.random() * cols.length) | 0]
            });
        }
        beep(220, 0.5, 'sawtooth', 0.09, 40);
    }

    function update(dt) {
        time += dt;
        var i;

        for (i = particles.length - 1; i >= 0; i--) {
            var p = particles[i];
            p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
            if (p.life <= 0) particles.splice(i, 1);
        }
        for (i = popups.length - 1; i >= 0; i--) {
            popups[i].y -= 18 * dt; popups[i].life -= dt;
            if (popups[i].life <= 0) popups.splice(i, 1);
        }
        if (shake > 0) shake -= dt;

        if (state === 'title') { dist += 50 * dt; return; }
        if (state === 'over') { overTime += dt; return; }

        // Speed ramps up over time.
        speed = Math.min(230, speed + 3.2 * dt);
        dist += speed * dt;

        // Steering.
        var target = steer() * (70 + speed * 0.25);
        player.vx += (target - player.vx) * Math.min(1, 14 * dt);
        player.x += player.vx * dt;
        var minX = ROAD_L + CAR_W / 2 + 1, maxX = ROAD_R - CAR_W / 2 - 1;
        if (player.x < minX) { player.x = minX; player.vx = 0; }
        if (player.x > maxX) { player.x = maxX; player.vx = 0; }

        // Traffic drives the same way, slower than the player.
        var rel = speed * 0.6;
        spawnDist -= rel * dt;
        if (spawnDist <= 0) spawnRow();

        var px = player.x - CAR_W / 2, py = playerY();
        for (i = traffic.length - 1; i >= 0; i--) {
            var c = traffic[i];
            c.y += rel * dt;
            if (c.y > H + 4) { traffic.splice(i, 1); continue; }
            // Collision (boxes shrunk by 1px to be forgiving).
            if (px + 1 < c.x + CAR_W - 1 && px + CAR_W - 1 > c.x + 1 &&
                py + 1 < c.y + CAR_H - 1 && py + CAR_H - 1 > c.y + 1) {
                crash();
                return;
            }
            // Near-miss bonus when overtaking closely.
            if (!c.passed && c.y > py + CAR_H) {
                c.passed = true;
                if (Math.abs(c.x - px) < CAR_W + 3) {
                    bonus += 20;
                    popups.push({ x: player.x, y: py - 4, text: '+20', color: '#7df9ff', life: 0.7 });
                    beep(990, 0.06, 'square', 0.03);
                }
            }
        }

        for (i = coins.length - 1; i >= 0; i--) {
            var k = coins[i];
            k.y += speed * dt;
            if (k.y > H + 6) { coins.splice(i, 1); continue; }
            if (Math.abs(k.x - player.x) < 8 && k.y > py - 4 && k.y < py + CAR_H + 2) {
                coins.splice(i, 1);
                bonus += 50;
                popups.push({ x: player.x, y: py - 4, text: '+50', color: '#ffd23f', life: 0.7 });
                beep(880, 0.07, 'square', 0.04);
                setTimeout(function () { beep(1320, 0.1, 'square', 0.04); }, 60);
            }
        }
    }

    // ---- Drawing ---------------------------------------------------------
    function hash(n) {
        n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4);
        n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15);
        return (n >>> 0) / 4294967296;
    }

    function drawTree(x, y) {
        ctx.fillStyle = '#145a1e'; ctx.fillRect(x, y + 1, 6, 5);
        ctx.fillRect(x + 1, y, 4, 7);
        ctx.fillStyle = '#2f9e3a'; ctx.fillRect(x + 1, y + 1, 3, 3);
    }

    function drawScenery() {
        var off = Math.floor(dist);
        var first = Math.floor(off / 16);
        var r, y;
        // Grass bands.
        for (r = first + 1; (y = off - r * 16) < H; r--) {
            ctx.fillStyle = (r & 1) ? '#2a8f35' : '#257f2f';
            ctx.fillRect(0, y, W, 16);
        }
        for (r = first + 1; (y = off - r * 16) < H; r--) {
            var h1 = hash(r * 2 + 1), h2 = hash(r * 2 + 2);
            if (h1 < 0.45) drawTree(1 + Math.floor(h1 * 14), y + 4);
            if (h2 < 0.45) drawTree(ROAD_R + 4 + Math.floor(h2 * 14), y + 9);
        }
        // Asphalt.
        ctx.fillStyle = '#3a3a42';
        ctx.fillRect(ROAD_L, 0, ROAD_R - ROAD_L, H);
        // Red/white kerbs.
        for (y = (off % 16) - 16; y < H; y += 8) {
            ctx.fillStyle = (Math.floor((y - off) / 8) & 1) ? '#e8e8e8' : '#d83a3a';
            ctx.fillRect(ROAD_L - 2, y, 2, 8);
            ctx.fillRect(ROAD_R, y, 2, 8);
        }
        // Lane dashes.
        ctx.fillStyle = '#c9c9c9';
        for (var l = 1; l < LANES; l++) {
            for (y = (off % 16) - 16; y < H; y += 16) {
                ctx.fillRect(ROAD_L + l * LANE_W, y, 1, 8);
            }
        }
    }

    function drawCar(x, y, body, isPlayer) {
        x = Math.round(x); y = Math.round(y);
        // Wheels.
        ctx.fillStyle = '#111';
        ctx.fillRect(x - 1, y + 2, 2, 4); ctx.fillRect(x + CAR_W - 1, y + 2, 2, 4);
        ctx.fillRect(x - 1, y + 10, 2, 4); ctx.fillRect(x + CAR_W - 1, y + 10, 2, 4);
        // Body.
        ctx.fillStyle = body;
        ctx.fillRect(x + 1, y, CAR_W - 2, CAR_H);
        ctx.fillRect(x, y + 1, CAR_W, CAR_H - 2);
        // Windows.
        ctx.fillStyle = '#1b2a3a';
        ctx.fillRect(x + 2, y + 4, CAR_W - 4, 3);
        ctx.fillRect(x + 2, y + 10, CAR_W - 4, 2);
        // Roof highlight.
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.fillRect(x + 2, y + 7, CAR_W - 4, 3);
        if (isPlayer) {
            ctx.fillStyle = '#fff';                       // racing stripe
            ctx.fillRect(x + 4, y, 2, 4);
            ctx.fillRect(x + 4, y + 12, 2, 4);
            ctx.fillStyle = '#fff7a8';                    // headlights
            ctx.fillRect(x + 1, y, 2, 1); ctx.fillRect(x + CAR_W - 3, y, 2, 1);
        }
        ctx.fillStyle = '#ff2b2b';                        // tail lights
        ctx.fillRect(x + 1, y + CAR_H - 1, 2, 1); ctx.fillRect(x + CAR_W - 3, y + CAR_H - 1, 2, 1);
    }

    function drawCoin(k) {
        var x = Math.round(k.x), y = Math.round(k.y);
        var wide = (Math.floor(time * 8) & 1) === 0;
        ctx.fillStyle = '#b8860b';
        if (wide) { ctx.fillRect(x - 3, y - 2, 6, 4); ctx.fillRect(x - 2, y - 3, 4, 6); }
        else { ctx.fillRect(x - 1, y - 3, 2, 6); }
        ctx.fillStyle = '#ffd23f';
        if (wide) { ctx.fillRect(x - 2, y - 2, 4, 4); ctx.fillStyle = '#fff3b0'; ctx.fillRect(x - 1, y - 2, 1, 2); }
        else { ctx.fillRect(x - 1, y - 2, 1, 4); }
    }

    function draw() {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        if (shake > 0) {
            ctx.translate(Math.round((Math.random() - 0.5) * 4), Math.round((Math.random() - 0.5) * 4));
        }
        drawScenery();

        var i;
        for (i = 0; i < coins.length; i++) drawCoin(coins[i]);
        for (i = 0; i < traffic.length; i++) drawCar(traffic[i].x, traffic[i].y, traffic[i].color, false);
        if (state !== 'over') {
            var py = state === 'title' ? H - 30 : playerY();
            drawCar(player.x - CAR_W / 2, py, '#e02828', true);
        }
        for (i = 0; i < particles.length; i++) {
            ctx.fillStyle = particles[i].color;
            ctx.fillRect(Math.round(particles[i].x), Math.round(particles[i].y), 2, 2);
        }
        for (i = 0; i < popups.length; i++) {
            var pp = popups[i];
            drawText(pp.text, Math.round(pp.x - textWidth(pp.text, 1) / 2), Math.round(pp.y), pp.color, 1);
        }

        ctx.setTransform(1, 0, 0, 1, 0, 0);

        if (state === 'play' || state === 'over') {
            // HUD bar.
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.fillRect(0, 0, W, 9);
            drawText(score(), 2, 2, '#fff', 1);
            var sp = Math.round(speed) + ' KMH';
            drawText(sp, W - textWidth(sp, 1) - 2, 2, '#7df9ff', 1);
        }

        if (state === 'title') {
            var ty = Math.round(H * 0.2);
            drawTextC('PIXEL', ty, '#ffd23f', 3);
            drawTextC('RACER', ty + 19, '#e02828', 3);
            if (Math.floor(time * 2) & 1) drawTextC('TAP TO START', ty + 46, '#fff', 1);
            drawTextC('HOLD LEFT-RIGHT', ty + 60, '#c9c9c9', 1);
            drawTextC('SIDE TO STEER', ty + 68, '#c9c9c9', 1);
            if (best > 0) drawTextC('BEST ' + best, ty + 82, '#7df9ff', 1);
        } else if (state === 'over') {
            var oy = Math.round(H * 0.28);
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(8, oy - 6, W - 16, 58);
            drawTextC('CRASH!', oy, '#e02828', 2);
            drawTextC('SCORE ' + score(), oy + 17, '#fff', 1);
            drawTextC(score() >= best && best > 0 ? 'NEW BEST!' : 'BEST ' + best, oy + 26, '#ffd23f', 1);
            if (overTime > 0.7 && (Math.floor(time * 2) & 1)) drawTextC('TAP TO RETRY', oy + 40, '#fff', 1);
        }
    }

    // ---- Main loop -------------------------------------------------------
    var last = 0;
    function frame(t) {
        var dt = Math.min(0.05, (t - last) / 1000 || 0);
        last = t;
        update(dt);
        draw();
        requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
})();
</script>
</body>
</html>
